<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reel 20 Octubre</title>
<style>
  html,body{margin:0;background:#3a3a3a;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="words.js"></script>
<script>
/* =========================================================================
   REEL 20 OCTUBRE — overlay de motion graphics + subtítulos
   1080x1920 / 24fps / 1513 cuadros (00:01:03:01). Fondo transparente.
   Todo es función pura del tiempo t (segundos).
   ========================================================================= */
const W = 1080, H = 1920, HALF = 960;
const FPS = 24, FRAMES = 63 * FPS + 1; // duración 00:01:03:01 = 1513 cuadros
const C = { k: '#0A0A0A', w: '#FFFFFF', lime: '#D4FF3A', red: '#FF3B2F', gray: '#8C8C8C', soft: '#ECECEC', mid: '#3A3A3A' };
const DISP = '"Inter Display","Inter",sans-serif';
const MONO = '"JetBrains Mono",monospace';
const TAU = Math.PI * 2;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outBackBig: x => { const c1 = 3, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const spring = (x, f = 16, d = 7) => x <= 0 ? 0 : 1 - Math.exp(-d * x) * Math.cos(f * x);
const pop = (t, t0, d = .45) => E.outBackBig(prog(t, t0, t0 + d));

// ---------- text ----------
function setF(ctx, size, weight = 900, family = DISP, track = 0) {
  ctx.font = `${weight} ${size}px ${family}`; ctx.letterSpacing = track + 'px';
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
}
function tw(ctx, s, track = 0) { return ctx.measureText(s).width - track; }
// plain text; returns width
function T(ctx, s, x, y, o = {}) {
  const { size = 60, weight = 900, family = DISP, color = C.w, align = 'left', track = 0, alpha = 1 } = o;
  ctx.save(); setF(ctx, size, weight, family, track); ctx.fillStyle = color; ctx.globalAlpha *= alpha;
  const w = tw(ctx, s, track);
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.fillText(s, x0, y); ctx.restore(); return w;
}
// largest size <= size so that text fits maxW
function fit(ctx, s, maxW, size, weight = 900, family = DISP, track = 0) {
  ctx.save(); setF(ctx, size, weight, family, track); const w = tw(ctx, s, track); ctx.restore();
  return w > maxW ? size * maxW / w : size;
}
// letters rise from behind a mask, staggered. returns width
function rise(ctx, s, x, y, o, t, t0, tOut = null) {
  const { size = 60, weight = 900, family = DISP, color = C.w, align = 'left', track = 0, stagger = .025, dur = .38 } = o;
  ctx.save(); setF(ctx, size, weight, family, track); ctx.fillStyle = color;
  const w = tw(ctx, s, track);
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const top = y - size * .84, bot = y + size * .2;
  ctx.beginPath(); ctx.rect(x0 - size, top, w + size * 2, bot - top); ctx.clip();
  let cx = x0;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i]; const cw = ctx.measureText(ch).width;
    const p = E.outExpo(prog(t, t0 + i * stagger, t0 + i * stagger + dur));
    let dy = (1 - p) * (bot - top + 8);
    if (tOut !== null) dy -= E.inExpo(prog(t, tOut + i * .01, tOut + i * .01 + .16)) * (bot - top + 8);
    if (p > 0) ctx.fillText(ch, cx, y + dy);
    cx += cw;
  }
  ctx.restore(); return w;
}
// block that wipes in from the left (marker highlight)
function block(ctx, x, y, w, h, p, color, r = 0) {
  if (p <= 0) return;
  ctx.save(); ctx.fillStyle = color; ctx.beginPath();
  ctx.roundRect(x, y, w * clamp(p), h, r); ctx.fill(); ctx.restore();
}
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// scale around a point
function around(ctx, x, y, s, rot = 0) { ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.translate(-x, -y); }
// camera punch on beat hits
function punch(ctx, t, hits, cx, cy) {
  let s = 1, dx = 0, dy = 0;
  for (const [ht, amp] of hits) {
    if (t < ht) continue;
    const d = t - ht, a = Math.exp(-d * 9);
    s += amp * .045 * a; dx += amp * 7 * Math.exp(-d * 18) * Math.sin(d * 80 + ht * 9); dy += amp * 7 * Math.exp(-d * 18) * Math.cos(d * 70 + ht * 5);
  }
  ctx.translate(dx, dy); around(ctx, cx, cy, s);
}

// ---------- icons (all stroked/filled around cx,cy) ----------
function polyline(ctx, pts, p) {
  // stroke the first p (0..1) of a polyline
  let L = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); L += l; }
  let rem = L * clamp(p); ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length && rem > 0; i++) {
    const k = Math.min(1, rem / seg[i - 1]);
    ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)); rem -= seg[i - 1];
  }
  ctx.stroke();
}
function check(ctx, x, y, s, p, color, lw) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  polyline(ctx, [[x - s * .5, y], [x - s * .14, y + s * .36], [x + s * .55, y - s * .38]], p); ctx.restore();
}
function clock(ctx, x, y, r, t, color, lw, speed = 1) {
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU, r1 = r * (i % 3 ? .82 : .74);
    ctx.lineWidth = lw * (i % 3 ? .4 : .7);
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); ctx.lineTo(x + Math.cos(a) * r * .9, y + Math.sin(a) * r * .9); ctx.stroke();
  }
  const am = t * TAU * 1.6 * speed - Math.PI / 2, ah = t * TAU * .14 * speed - Math.PI / 2 + 1;
  ctx.lineWidth = lw * 1.1;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ah) * r * .45, y + Math.sin(ah) * r * .45); ctx.stroke();
  ctx.lineWidth = lw * .8;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(am) * r * .68, y + Math.sin(am) * r * .68); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, lw * 1.1, 0, TAU); ctx.fill();
  ctx.restore();
}
function coin(ctx, x, y, r, t, fill, ink) {
  const sx = Math.cos(t * 5.5);
  ctx.save(); ctx.translate(x, y); ctx.scale(Math.max(.08, Math.abs(sx)), 1);
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = r * .07; ctx.beginPath(); ctx.arc(0, 0, r * .8, 0, TAU); ctx.stroke();
  if (sx > 0) T(ctx, '$', 0, r * .36, { size: r * 1.05, weight: 900, color: ink, align: 'center' });
  ctx.restore();
}
function bulb(ctx, x, y, s, color, lw, glow = 0) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.arc(x, y - s * .15, s * .42, Math.PI * .78, Math.PI * 2.22); ctx.lineTo(x + s * .17, y + s * .38); ctx.lineTo(x - s * .17, y + s * .38); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - s * .15, y + s * .52); ctx.lineTo(x + s * .15, y + s * .52); ctx.stroke();
  for (let i = 0; i < 5 && glow > 0; i++) {
    const a = -Math.PI / 2 + (i - 2) * .55, r1 = s * .62, r2 = s * (.62 + .2 * glow);
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r1, y - s * .15 + Math.sin(a) * r1); ctx.lineTo(x + Math.cos(a) * r2, y - s * .15 + Math.sin(a) * r2); ctx.stroke();
  }
  ctx.restore();
}
function rec(ctx, x, y, s, t, color, lw) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round';
  rrect(ctx, x - s * .55, y - s * .34, s * .8, s * .68, s * .12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + s * .25, y - s * .1); ctx.lineTo(x + s * .55, y - s * .3); ctx.lineTo(x + s * .55, y + s * .3); ctx.lineTo(x + s * .25, y + s * .1); ctx.closePath(); ctx.stroke();
  ctx.fillStyle = C.red; ctx.globalAlpha = Math.sin(t * 9) > -.3 ? 1 : .15;
  ctx.beginPath(); ctx.arc(x - s * .15, y, s * .14, 0, TAU); ctx.fill(); ctx.restore();
}
function timeline(ctx, x, y, s, t, color, lw) {
  ctx.save(); ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = lw * .7;
  const rows = [[-.55, .5], [-.3, .75], [-.6, .35]];
  rows.forEach(([a, l], i) => { rrect(ctx, x + s * a, y - s * .35 + i * s * .3, s * l, s * .18, s * .05); ctx.fill(); });
  const ph = x + s * (-.5 + ((t * .8) % 1) * 1.0);
  ctx.strokeStyle = C.red; ctx.lineWidth = lw * .6; ctx.beginPath(); ctx.moveTo(ph, y - s * .5); ctx.lineTo(ph, y + s * .45); ctx.stroke();
  ctx.restore();
}
function plane(ctx, x, y, s, t, color, lw) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .55, y - s * .05); ctx.lineTo(x + s * .55, y - s * .45); ctx.lineTo(x + s * .15, y + s * .5); ctx.lineTo(x - s * .05, y + s * .1); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - s * .05, y + s * .1); ctx.lineTo(x + s * .55, y - s * .45); ctx.stroke();
  ctx.restore();
}
function phone(ctx, x, y, s, t, color, lw) {
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
  rrect(ctx, x - s * .3, y - s * .52, s * .6, s * 1.04, s * .1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - s * .08, y - s * .42); ctx.lineTo(x + s * .08, y - s * .42); ctx.stroke();
  ctx.fillStyle = C.red; ctx.globalAlpha = Math.sin(t * 8) > -.2 ? 1 : .2;
  ctx.beginPath(); ctx.arc(x, y + s * .05, s * .1, 0, TAU); ctx.fill(); ctx.restore();
}
function sun(ctx, x, y, s, t, color, lw) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, s * .26, 0, TAU); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + t * 1.2, r1 = s * .4, r2 = s * (.55 + .05 * Math.sin(t * 8 + i));
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); ctx.stroke();
  }
  ctx.restore();
}
function mute(ctx, x, y, s, color, lw) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .5, y - s * .15); ctx.lineTo(x - s * .28, y - s * .15); ctx.lineTo(x, y - s * .42); ctx.lineTo(x, y + s * .42); ctx.lineTo(x - s * .28, y + s * .15); ctx.lineTo(x - s * .5, y + s * .15); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + s * .18, y - s * .16); ctx.lineTo(x + s * .5, y + s * .16); ctx.moveTo(x + s * .5, y - s * .16); ctx.lineTo(x + s * .18, y + s * .16); ctx.stroke();
  ctx.restore();
}
function building(ctx, x, y, s, color, lw) {
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round';
  ctx.strokeRect(x - s * .32, y - s * .5, s * .64, s * 1);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) ctx.fillRect(x - s * .2 + c * s * .24, y - s * .36 + r * s * .24, s * .14, s * .12);
  ctx.restore();
}
function person(ctx, x, y, s, color, lw) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y - s * .2, s * .2, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y + s * .5, s * .38, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  ctx.restore();
}
function play(ctx, x, y, s, color) {
  ctx.save(); ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x - s * .32, y - s * .4); ctx.lineTo(x + s * .42, y); ctx.lineTo(x - s * .32, y + s * .4); ctx.closePath(); ctx.fill(); ctx.restore();
}
function pinIcon(ctx, x, y, s, fill, ink) {
  ctx.save(); ctx.fillStyle = fill;
  ctx.beginPath(); ctx.arc(x, y - s * .55, s * .45, Math.PI * .8, Math.PI * 2.2); ctx.lineTo(x, y); ctx.closePath(); ctx.fill();
  T(ctx, '?', x, y - s * .38, { size: s * .55, color: ink, align: 'center' });
  ctx.restore();
}

// ---------- panel backgrounds ----------
function gridBG(ctx, t, dark, y0, y1) {
  ctx.save();
  if (dark) {
    ctx.strokeStyle = 'rgba(255,255,255,0.055)'; ctx.lineWidth = 2;
    const off = (t * 30) % 90;
    for (let x = -90 + off; x < W + 90; x += 90) { ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke(); }
    for (let y = y0 - 90 + off; y < y1 + 90; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.075)';
    const off = (t * 24) % 60;
    for (let y = y0 - 60 + off; y < y1 + 60; y += 60) for (let x = 30; x < W; x += 60) { ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
}
// height of the black top panel (0..960) at time t
function panelH(seg, t) {
  if (!seg || seg.kind !== 'A') return 0;
  const pin = seg.fromFull ? E.outExpo(prog(t, seg.t0 + .04, seg.t0 + .34)) : E.outExpo(prog(t, seg.t0, seg.t0 + .3));
  const pout = seg.hold ? 0 : E.inExpo(prog(t, seg.t1 - .22, seg.t1));
  return HALF * pin * (1 - pout);
}
function panelA(ctx, t, seg, body) {
  const h = panelH(seg, t);
  if (seg.fromFull) { // white full screen collapses into the top half
    const q = E.inOutCubic(prog(t, seg.t0, seg.t0 + .3));
    const wh = lerp(H, HALF, q);
    if (q < 1) { ctx.fillStyle = C.w; ctx.fillRect(0, 0, W, wh); }
  }
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, h); ctx.clip();
  ctx.fillStyle = C.k; ctx.fillRect(0, 0, W, h);
  gridBG(ctx, t, true, 0, HALF);
  ctx.translate(0, (h - HALF) * .55);
  body();
  ctx.restore();
  if (h > 1) { // lime seam
    const th = lerp(34, 8, E.outCubic(prog(t, seg.t0 + .15, seg.t0 + .55))) + 26 * E.inExpo(prog(t, seg.t1 - .22, seg.t1)) * (seg.hold ? 0 : 1);
    ctx.fillStyle = C.lime; ctx.fillRect(0, h - th / 2, W, th);
  }
}
function panelB(ctx, t, seg, body) {
  const pin = E.outExpo(prog(t, seg.t0, seg.t0 + .32));
  const pout = seg.hold ? 0 : E.inExpo(prog(t, seg.t1 - .2, seg.t1));
  const top = lerp(H, 0, pin) + H * pout;
  if (seg.fromTop && pin < 1) { // previous black top half stays underneath while white rises
    ctx.fillStyle = C.k; ctx.fillRect(0, 0, W, HALF); gridBG(ctx, t, true, 0, HALF);
    ctx.fillStyle = C.lime; ctx.fillRect(0, HALF - 4, W, 8);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(0, top, W, H - top); ctx.clip();
  ctx.fillStyle = C.w; ctx.fillRect(0, 0, W, H);
  gridBG(ctx, t, false, 0, H);
  ctx.translate(0, top * .6);
  body();
  ctx.restore();
  const th = 44 * (1 - E.outCubic(prog(t, seg.t0 + .12, seg.t0 + .5))) + 44 * E.inCubic(prog(t, seg.t1 - .2, seg.t1)) * (seg.hold ? 0 : 1);
  if (th > .5 && top < H) { ctx.fillStyle = C.lime; ctx.fillRect(0, top - th, W, th); }
}
// small mono tag in a pill
function tag(ctx, s, x, y, p, fill, ink, align = 'left') {
  if (p <= 0) return;
  ctx.save(); setF(ctx, 30, 700, MONO, 6);
  const w = tw(ctx, s, 6) + 52, h = 58;
  const x0 = align === 'center' ? x - w / 2 : x;
  ctx.globalAlpha = clamp(p * 3);
  ctx.fillStyle = fill; rrect(ctx, x0, y - h / 2, w * E.outExpo(p), h, h / 2); ctx.fill();
  ctx.beginPath(); ctx.rect(x0, y - h, w * E.outExpo(p), h * 2); ctx.clip();
  ctx.fillStyle = ink; ctx.fillText(s, x0 + 26, y + 11);
  ctx.restore();
}

// =========================================================================
// SCENES
// =========================================================================
// A1 — "Depende de dos cosas: tiempo y dinero"
function sA1(ctx, t, seg) {
  panelA(ctx, t, seg, () => {
    ctx.save(); punch(ctx, t, [[2.96, 1], [3.59, .7], [4.34, .9]], 540, 480);
    const k = E.inOutExpo(prog(t, 3.42, 3.78));
    // headline: DEPENDE DE / 2 COSAS
    rise(ctx, 'DEPENDE DE', 540, lerp(330, 196, k), { size: lerp(76, 46, k), weight: 800, track: lerp(14, 10, k), align: 'center' }, t, 2.42);
    const s2 = lerp(fit(ctx, '2 COSAS', 900, 250), 112, k), y2 = lerp(590, 318, k);
    const p2 = pop(t, 2.93, .5);
    if (p2 > 0) {
      ctx.save(); around(ctx, 540, y2 - s2 * .35, p2, (1 - p2) * -.2);
      ctx.save(); setF(ctx, s2, 900, DISP, -s2 * .03);
      const w2 = tw(ctx, '2 ', -s2 * .03), wAll = tw(ctx, '2 COSAS', -s2 * .03); ctx.restore();
      T(ctx, '2', 540 - wAll / 2, y2, { size: s2, color: C.lime, track: -s2 * .03 });
      rise(ctx, 'COSAS', 540 - wAll / 2 + w2, y2, { size: s2, track: -s2 * .03 }, t, 3.16);
      ctx.restore();
    }
    // cards
    const cards = [[290, 3.56, 'TIEMPO'], [790, 4.31, 'DINERO']];
    cards.forEach(([x, t0, label], i) => {
      const p = pop(t, t0, .5); if (p <= 0) return;
      ctx.save(); around(ctx, x, 560, p, (1 - p) * (i ? .5 : -.5));
      ctx.fillStyle = '#161616'; ctx.beginPath(); ctx.arc(x, 560, 140, 0, TAU); ctx.fill();
      if (i === 0) clock(ctx, x, 560, 96, t, C.lime, 11, 1.4);
      else coin(ctx, x, 560, 96, t - t0, C.lime, C.k);
      ctx.restore();
      rise(ctx, label, x, 790, { size: 78, align: 'center', track: 2 }, t, t0 + .06);
    });
    const pp = pop(t, 4.2, .4);
    if (pp > 0) { ctx.save(); around(ctx, 540, 560, pp, (1 - pp) * 2); T(ctx, '+', 540, 590, { size: 110, color: C.lime, align: 'center' }); ctx.restore(); }
    ctx.restore();
  });
}

// meter row used by the three "OPCIÓN" title cards (B1, B3, B4)
function meterRow(ctx, t, y, qual, word, tq, tw0, fillTo, tFill, kind) {
  if (qual) rise(ctx, qual, 96, y, { size: 50, weight: 700, family: MONO, track: 12, color: C.k }, t, tq);
  const sz = fit(ctx, word, 888, 210, 900, DISP, -6);
  rise(ctx, word, 92, y + 20 + sz * .78, { size: sz, track: -6, color: C.k, stagger: .02 }, t, tw0);
  const by = y + 70 + sz * .78, bw = 888, bh = 70;
  const pa = E.outExpo(prog(t, tw0, tw0 + .3));
  if (pa <= 0) return;
  ctx.save(); ctx.fillStyle = C.soft; rrect(ctx, 96, by, bw * pa, bh, bh / 2); ctx.fill();
  const f = fillTo * E.outExpo(prog(t, tFill, tFill + .55));
  const fw = Math.max(bh, bw * f);
  if (fillTo > 0) {
    ctx.fillStyle = kind === 'time' ? C.k : C.lime; rrect(ctx, 96, by, fw, bh, bh / 2); ctx.fill();

  ['00:00:44:19', '00:00:49:05', 'A', sA5],
  ['00:00:54:11', '00:00:57:00', 'A', sA6],
  ['00:00:58:08', '00:00:59:23', 'B', sB5],

SEGS.forEach((s, i) => {
  const n = SEGS[i + 1], p = SEGS[i - 1];
  s.hold = !!(n && n.f0 === s.f1 + 1);           // next segment starts right away: no exit
  s.fromTop = !!(p && p.f1 + 1 === s.f0 && p.kind === 'A' && s.kind === 'B');

// =========================================================================
// SUBTITLES — word-by-word from the .srt
// =========================================================================
const fullAt = t => SEGS.find(s => s.kind === 'B' && t >= s.t0 && t < s.t1);
const WORDS = window.WORDS.map(([s, e, w], i) => ({ s, e, w: w.replace(/[.,]+$/, ''), i }));
WORDS.forEach(w => { w.hidden = !!fullAt((w.s + w.e) / 2); w.emph = /%$|^YA$/.test(w.w); });
const PHRASES = (() => {
  const vis = WORDS.filter(w => !w.hidden), out = []; let cur = [];
  const len = a => a.reduce((n, w) => n + w.w.length + 1, 0);
  vis.forEach((w, k) => {
    const prev = cur[cur.length - 1];

// =========================================================================
// FRAME
// =========================================================================
function render(ctx, t, i) {

const out = document.getElementById('out');
const octx = out.getContext('2d');
const sub = document.createElement('canvas'); sub.width = W; sub.height = H;
const sctx = sub.getContext('2d', { willReadFrequently: true });

const acc = new Float32Array(W * H * 4);

function frame(i) {

window.ready = (async () => {
  for (const w of [500, 700, 800, 900]) await document.fonts.load(`${w} 100px "Inter Display"`);
  for (const w of [500, 700]) await document.fonts.load(`${w} 100px "JetBrains Mono"`);
  return true;
})();
window.renderFrame = i => { frame(i); return out.toDataURL('image/png'); };
// review still: frame composited over a stand-in for the camera footage
window.renderStill = i => {
  frame(i);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#6b6f78'); g.addColorStop(1, '#2c2e33');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,255,255,.12)'; x.beginPath(); x.arc(540, 760, 190, 0, TAU); x.fill();
  x.beginPath(); x.ellipse(540, 1380, 380, 420, 0, Math.PI, TAU); x.fill();
  x.drawImage(out, 0, 0); return c.toDataURL('image/jpeg', .85);
};
window.FRAMES = FRAMES;
window.SEGS = SEGS; window.PHRASES = PHRASES;
// live preview when opened in a browser (no motion blur)
if (!navigator.webdriver) {
  window.ready.then(() => {
    const st = performance.now();
    const loop = () => { const t = ((performance.now() - st) / 1000) % (FRAMES / FPS); render(octx, t, Math.floor(t * FPS)); requestAnimationFrame(loop); };
    loop();
  });
}
